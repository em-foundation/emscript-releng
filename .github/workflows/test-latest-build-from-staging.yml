name: Test latest sdk build from staging

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout emscript-releng
        uses: actions/checkout@v4
        with:
          path: emscript-releng
          token: ${{ secrets.token }}

      - name: Get Release Assets
        run: |
          echo "token=${{ secrets.token }}"
          echo "url=${{ github.api_url }}"
          echo "tag_name=${{ github.event.release.tag_name }}"

          # Get the release information by tag
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.token }}" \
            "${{ github.api_url }}/repos/em-foundation/npm-packages/releases/tags/resources")
          echo "RELEASE_INFO=$RELEASE_INFO"
          which jq
          RELEASE_ID=$(echo "$RELEASE_INFO" | jq '.id')
          echo "RELEASE_ID=$RELEASE_ID"

          # # List release assets using the release ID
          # curl -s -H "Authorization: token ${{ secrets.token }}" \
          #   "${{ github.api_url }}/repos/em-foundation/npm-packages/releases/${RELEASE_ID}/assets" | jq '.'
